name: Verify desktop and CLI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.target }} desktop and CLI
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: windows-x64
          - os: macos-15
            target: macos-arm64
          - os: ubuntu-24.04
            target: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node node_modules/electron/install.js
      - run: node node_modules/esbuild/install.js
      - name: Runtime, CLI and updater tests
        run: npm test
      - name: Verify packaged desktop and standalone CLI
        run: npm run verify:platform
      - name: Save platform verification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-${{ matrix.target }}
          path: dist/verify-${{ matrix.target }}/verification.json
          if-no-files-found: error
          retention-days: 7
